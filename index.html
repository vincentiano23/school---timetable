<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kenya School Timetable Pro</title>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- MOBILE NAV BAR --- */
        .mobile-nav-bar {
            display: none;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            z-index: 60;
            position: relative;
        }
        
        .nav-arrow-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3);
        }
        
        .nav-arrow-btn:active { transform: scale(0.95); }

        /* --- ANIMATIONS --- */
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* --- SIDEBAR --- */
        aside {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 50;
            transition: transform 0.3s ease;
        }

        aside h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            background: none; border: none;
            width: 100%; text-align: left;
            padding: 14px 16px; margin-bottom: 8px;
            cursor: pointer; border-radius: var(--radius);
            font-weight: 600; color: var(--text-light);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 12px;
        }
        .nav-btn:hover { background: #eff6ff; color: var(--primary); transform: translateX(5px); }
        .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* --- MAIN CONTENT --- */
        main { flex: 1; padding: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .view-section { display: none; height: 100%; flex-direction: column; }
        .view-section.active { display: flex; }

        /* --- TOOLBAR --- */
        .toolbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 10px; }

        .toolbar input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border 0.2s;
        }
        .toolbar input:focus { border-color: var(--primary); }
        .toolbar input.school-input { font-weight: bold; width: 250px; background: #f8fafc; }

        .toolbar-actions { margin-left: auto; display: flex; gap: 10px; }

        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text-light); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #fee2e2; color: #ef4444; }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
        .btn-success { background: var(--success); color: white; }

        /* --- EDITOR TABLE --- */
        .editor-container {
            padding: 20px;
            overflow-x: auto;
            flex: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        th.day-header, td.day-cell {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 18px 6px;
            text-align: center;
            min-width: 35px;
            letter-spacing: 1px;
            font-size: 0.85rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        td.stream-cell {
            background-color: #f1f5f9;
            font-weight: 700;
            color: var(--text);
            min-width: 90px;
            text-align: left;
            padding-left: 15px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        th.time-header {
            background-color: #f8fafc;
            font-size: 0.75rem;
            color: var(--text-light);
            min-width: 75px;
            padding: 6px;
            text-transform: uppercase;
        }

        td.slot-cell {
            cursor: pointer;
            min-height: 60px;
            font-size: 0.8rem;
            transition: all 0.1s;
            position: relative;
            padding: 4px;
        }

        td.slot-cell:hover { background-color: #eff6ff; transform: scale(1.01); border-color: var(--primary); z-index: 2; }
        
        td.slot-cell.conflict { background-color: #fee2e2; border: 2px solid var(--danger); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .stack-item {
            background: rgba(255,255,255,0.6);
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 2px 4px;
            margin-bottom: 2px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .stack-item:hover { background: #fff; border-color: var(--primary); }

        .slot-subject { font-weight: 700; color: var(--primary-dark); }
        .slot-teacher { color: var(--text-light); font-size: 0.7rem; }
        
        /* Break Styles in Editor */
        .break-editor {
            background-color: #e2e8f0;
            color: #64748b;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 1px;
        }

        .slot-cell.activity { background-color: #fffbeb; font-style: italic; font-weight: bold; color: #b45309; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* --- LIST ITEMS (Settings) --- */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: white;
            transition: background 0.2s;
        }
        .list-item:hover { background: #f8fafc; }
        .list-content { flex: 1; }
        .list-subtext { font-size: 0.75rem; color: #888; margin-top: 4px; }
        .list-actions { display: flex; gap: 5px; flex-shrink: 0;}
        .list-actions button { padding: 4px 8px; font-size: 0.7rem; }

        /* --- PRINT OPTIMIZATION --- */
        @media print {
            /* Hide UI elements strictly */
            aside, .view-section:not(#print-view), .toolbar, .mobile-menu-btn, .mobile-nav-bar, .no-print { display: none !important; }
            
            /* Reset layout for print */
            body, main { height: auto; overflow: visible; background: white; margin: 0; padding: 0; display: block; }
            #print-view-container { display: block !important; background: white; padding: 0; overflow: visible; }
            
            /* Fix "Empty Page" - Ensure container doesn't collapse */
            .print-paper { 
                width: 100%; 
                min-height: 100vh; 
                padding: 0; 
                margin: 0; 
                box-shadow: none; 
                box-sizing: border-box;
            }

            .print-header { text-align: center; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 5px; }
            .print-header h1 { margin: 0; font-size: 14pt; text-transform: uppercase; }
            .print-header p { margin: 2px 0 0 0; font-size: 10pt; }

            /* 2x2 Grid for Print Preview */
            .print-grid-container {
                display: grid;
                grid-template-columns: 1fr 1fr; 
                gap: 10px;
                page-break-inside: avoid;
            }

            .stream-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 7.5pt;
            }
            
            .stream-table th, .stream-table td {
                border: 1px solid #000;
                padding: 2px;
                text-align: center;
                vertical-align: middle;
            }

            .stream-title {
                background-color: #eee;
                font-weight: bold;
                padding: 4px;
                text-align: center;
                border: 1px solid #000;
            }

            .time-col { width: 60px; background-color: #f9f9f9; font-size: 7pt; }
            .day-col { width: auto; }
            
            .break-print { background-color: #e0e0e0 !important; font-weight: bold; color: #333; font-style: italic; font-size: 7pt; }
            
            .legend-box {
                margin-top: 10px; 
                border: 1px solid #000; 
                padding: 5px; 
                font-size: 7pt;
                display: flex; 
                justify-content: center;
                gap: 20px;
                page-break-inside: avoid;
            }
        }

        /* --- SCREEN PRINT PREVIEW --- */
        #print-view-container { padding: 20px; background: #cbd5e1; height: 100%; overflow-y: auto; display: flex; justify-content: center; }
        .print-paper { 
            background: white; 
            width: 100%; 
            max-width: 1200px; 
            padding: 15px; 
            box-shadow: var(--shadow-2xl); 
            margin-bottom: 40px; 
            box-sizing: border-box;
        }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 500px; box-shadow: var(--shadow-2xl); animation: fadeIn 0.3s ease; max-height: 90vh; overflow-y: auto;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        
        .combo-list { margin-top: 15px; border: 1px solid #eee; border-radius: 8px; background: #f9fafb; padding: 10px; max-height: 200px; overflow-y: auto; }
        .combo-item { display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .combo-item:last-child { border-bottom: none; }
        .remove-combo { color: var(--danger); cursor: pointer; font-weight: bold; font-size: 1.1rem; margin-left: 10px;}

        /* Dynamic Teacher Inputs */
        .part-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #eff6ff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--primary);
        }
        .part-label {
            min-width: 80px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--primary-dark);
            text-align: left;
        }
        .part-teacher-select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
        }

        .settings-card { background: white; padding: 25px; max-width: 700px; margin: 20px auto; border-radius: var(--radius); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Multi-select styling */
        .multi-select-label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        select[multiple] {
            width: 100%;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            height: 80px;
        }

        /* --- AFTERNOON ACTIVITY SELECTOR STYLES --- */
        #activitySelector {
            display: none;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .activity-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .activity-btn {
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .activity-btn:active { transform: scale(0.98); }
        .btn-games { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .btn-clubs { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .btn-societies { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .btn-games:hover { background: #bfdbfe; }
        .btn-clubs:hover { background: #bbf7d0; }
        .btn-societies:hover { background: #fde047; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 280px; box-shadow: 10px 0 25px rgba(0,0,0,0.1); }
            aside.open { transform: translateX(0); }
            .mobile-nav-bar { display: flex; }
            .mobile-menu-btn { display: block; }
            .toolbar { display: none; }
            
            .editor-container { padding: 10px; }
            td.stream-cell { min-width: 70px; font-size: 0.8rem; padding-left: 5px; }
            th.time-header { font-size: 0.65rem; min-width: 60px; }
            td.slot-cell { font-size: 0.75rem; }
            .settings-grid { grid-template-columns: 1fr; }
            .modal-content { width: 95%; padding: 20px; }
            .part-label { min-width: 60px; font-size: 0.9rem; }
            
            /* On mobile print preview, stack tables vertically */
            .print-grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" onclick="toggleSidebar()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:40;"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <h1>🇰🇪 Planner Pro</h1>
        <nav>
            <button class="nav-btn active" onclick="showView('editor')">📝 Editor</button>
            <button class="nav-btn" onclick="showView('print-view')">🖨️ Print / Export</button>
            <button class="nav-btn" onclick="showView('settings')">⚙️ Teachers & Subjects</button>
        </nav>
        <div style="margin-top: auto; font-size: 0.8rem; color: #94a3b8; text-align: center;">
            <p>Combination Split Support</p>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main>
        
        <!-- MOBILE NAVIGATION -->
        <div class="mobile-nav-bar">
            <button class="nav-arrow-btn" onclick="navMobile(-1)">&#10094;</button>
            <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
            <button class="nav-arrow-btn" onclick="navMobile(1)">&#10095;</button>
        </div>

        <!-- EDITOR VIEW -->
        <section id="editor" class="view-section active">
            <div class="toolbar">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                
                <input type="text" id="schoolName" class="school-input" placeholder="School Name" oninput="updateHeaderState()">
                <input type="text" id="poBox" placeholder="P.O. Box" style="width: 100px;" oninput="updateHeaderState()">
                <input type="text" id="termName" placeholder="Term" style="width: 80px;" oninput="updateHeaderState()">
                
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="autoFillDefaults()">Auto-Fill Breaks</button>
                    <button class="btn btn-secondary" onclick="generateRandom()">Randomize</button>
                    <button class="btn btn-danger" onclick="clearAll()">Clear</button>
                </div>
            </div>

            <div class="editor-container" id="editor-table-wrapper">
                <!-- Javascript renders table here -->
            </div>
        </section>

        <!-- PRINT VIEW -->
        <section id="print-view" class="view-section">
            <div style="background: white; padding: 10px; margin-bottom: 10px; text-align: right; border-bottom: 1px solid #ddd;" class="no-print">
                <div class="print-actions" style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="showView('editor')">← Back to Editor</button>
                    <button id="btnDownloadTemplate" class="btn btn-secondary" onclick="downloadTemplate()">📄 Download Empty Template</button>
                    <button id="btnDownloadPDF" class="btn btn-primary" onclick="downloadPDF()">💾 Download PDF File</button>
                    <button class="btn btn-success" onclick="window.print()">🖨️ Print (Hard Copy)</button>
                </div>
            </div>
            <div id="print-view-container">
                <div class="print-paper" id="print-paper-content">
                    <!-- Javascript renders print tables here -->
                </div>
            </div>
        </section>

        <!-- SETTINGS / TEACHER NUMBERS -->
        <section id="settings" class="view-section">
            <div class="settings-card animate-in">
                <h3 style="color:var(--primary); text-align:center;">Manage Data</h3>
                
                <div class="settings-grid">
                    
                    <!-- TEACHERS SECTION -->
                    <div>
                        <h4 style="border-bottom: 1px solid #eee; padding-bottom:5px; margin-bottom:15px; color:var(--text-light);">TEACHERS</h4>
                        
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                            <input type="text" id="newTeacherNum" placeholder="Num" style="width: 60px;">
                            <input type="text" id="newTeacher" placeholder="Name" style="flex:1;">
                            <input type="hidden" id="editTeacherId">
                        </div>
                        
                        <div style="display: flex; gap: 10px;">
                            <button id="btnAddTeacher" class="btn btn-primary" style="flex:1;" onclick="saveTeacher()">Add</button>
                            <button id="btnUpdateTeacher" class="btn btn-success" style="flex:1; display:none;" onclick="saveTeacher()">Update</button>
                            <button class="btn btn-secondary" style="width: 30px;" onclick="cancelEditTeacher()">✕</button>
                        </div>

                        <ul id="teacherList" style="padding-left: 0; margin-top: 0; max-height: 200px; overflow-y: auto; border:1px solid #eee;"></ul>
                    </div>

                    <!-- SUBJECTS SECTION -->
                    <div>
                        <h4 style="border-bottom: 1px solid #eee; padding-bottom:5px; margin-bottom:15px; color:var(--text-light);">SUBJECTS</h4>
                        
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 5px;">
                            <input type="text" id="newSubject" placeholder="Name (e.g. PHY/BIO)" style="flex:1;">
                            <input type="hidden" id="editSubjectId">
                        </div>

                        <!-- Teacher Assigner for Subject -->
                        <div style="margin-bottom: 10px;">
                            <label class="multi-select-label">Default Teachers:</label>
                            <select id="subjectTeachers" multiple>
                                <!-- Populated by JS -->
                            </select>
                            <p style="font-size:0.7rem; color:#666; margin:2px 0 0 0;">Hold Ctrl (Cmd) to select multiple</p>
                        </div>
                        
                        <div style="display: flex; gap: 10px;">
                            <button id="btnAddSubject" class="btn btn-primary" style="flex:1;" onclick="saveSubject()">Add</button>
                            <button id="btnUpdateSubject" class="btn btn-success" style="flex:1; display:none;" onclick="saveSubject()">Update</button>
                            <button class="btn btn-secondary" style="width: 30px;" onclick="cancelEditSubject()">✕</button>
                        </div>

                        <ul id="subjectList" style="padding-left: 0; margin-top: 0; max-height: 200px; overflow-y: auto; border:1px solid #eee;"></ul>
                    </div>

                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee; margin-top: auto;">
                <button class="btn btn-danger" style="width: 100%;" onclick="factoryReset()">⚠️ Factory Reset</button>
            </div>
        </section>

    </main>

    <!-- MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: var(--primary);">Edit Slot</h3>
            
            <!-- Normal Subject/Teacher Input -->
            <div id="normalInputContainer">
                <div style="margin-top:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:0.9rem;">Select Subject</label>
                    <select id="modalSubject" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;" onchange="setupTeacherInputs()">
                        <option value="">-- Select Subject --</option>
                        <!-- Populated by JS -->
                    </select>
                </div>

                <!-- Dynamic Area for Teacher Inputs -->
                <div id="teacherInputsContainer" style="margin-top: 15px; display: none;">
                    <label style="display:block; margin-bottom:10px; font-weight:bold; font-size:0.9rem; color:var(--primary-dark);">Assign Teacher to each part:</label>
                    <div id="teacherRows">
                        <!-- Inputs injected here -->
                    </div>
                </div>
            </div>

            <!-- 4-6 PM Activity Selector -->
            <div id="activitySelector">
                <label style="display:block; margin-bottom:15px; font-weight:bold; font-size:1rem; color:var(--text);">Afternoon Activity (4:00 - 6:00)</label>
                <div class="activity-btn-group">
                    <button type="button" class="activity-btn btn-games" onclick="selectActivity('GAMES')">⚽ GAMES</button>
                    <button type="button" class="activity-btn btn-clubs" onclick="selectActivity('CLUBS')">🎨 CLUBS</button>
                    <button type="button" class="activity-btn btn-societies" onclick="selectActivity('SOCIETIES')">🎭 SOCIETIES</button>
                </div>
                <p style="font-size:0.8rem; color:#666; margin-top:10px;">Selecting an option will save it immediately.</p>
            </div>

            <!-- Actions (Hidden for Activity Selector) -->
            <div class="modal-actions" id="modalActions">
                <button class="btn btn-danger" onclick="clearSlot()">Clear Slot</button>
                <button class="btn btn-primary" onclick="addToSlot()">+ Add to Slot</button>
                <button class="btn btn-success" onclick="saveSlot()">Done</button>
            </div>

            <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
            <div style="font-size:0.85rem; color:#666;">Current items in this slot:</div>
            <div id="comboList" class="combo-list"></div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const days = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"];
        const timeSlots = [
            "8:20–9:00", "9:00–9:40", "9:40–9:50", "9:50–10:30",
            "10:30–11:10", "11:10–11:40", "11:40–12:20", "12:20–1:00",
            "1:00–2:00", "2:00–2:40", "2:40–3:20", "3:20–4:00", "4:00–6:00"
        ];
        const streams = ["10 STEM", "10 S.S", "FORM 3", "FORM 4"];
        
        // Break Config
        const breakConfig = { 2: "SHORT BREAK", 5: "LONG BREAK", 8: "LUNCH" };
        const gamesConfig = {
            "MONDAY": "GAMES", "TUESDAY": "GAMES", "WEDNESDAY": "CLUBS", 
            "THURSDAY": "GAMES", "FRIDAY": "SOCIETIES"
        };

        // --- STATE ---
        let appState = {
            schoolName: "KENYA HIGH SCHOOL",
            poBox: "12345",
            term: "TERM 1",
            teachers: [],
            subjects: [],
            schedule: {} 
        };

        let currentEdit = null;
        let tempSlotItems = [];

        function init() {
            const saved = localStorage.getItem('schoolPlanner_v17');
            if (saved) {
                appState = JSON.parse(saved);
                appState.subjects = appState.subjects.map(s => ({...s, teachers: s.teachers || []}));
            } else {
                factoryReset();
            }
            
            document.getElementById('schoolName').value = appState.schoolName;
            document.getElementById('poBox').value = appState.poBox;
            document.getElementById('termName').value = appState.term;

            renderTeacherList();
            renderSubjectList();
            renderEditor();
        }

        function saveState() {
            localStorage.setItem('schoolPlanner_v17', JSON.stringify(appState));
        }

        function updateHeaderState() {
            appState.schoolName = document.getElementById('schoolName').value;
            appState.poBox = document.getElementById('poBox').value;
            appState.term = document.getElementById('termName').value;
            saveState();
            if(document.getElementById('print-view').classList.contains('active')) renderPrintView();
        }

        // --- NAVIGATION ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function navMobile(direction) {
            const views = ['editor', 'settings', 'print-view'];
            const current = document.querySelector('.view-section.active').id;
            let index = views.indexOf(current);
            let nextIndex = index + direction;
            if (nextIndex < 0) nextIndex = views.length -1;
            if (nextIndex >= views.length) nextIndex = 0;
            showView(views[nextIndex]);
        }

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(viewId === 'editor') document.querySelectorAll('.nav-btn')[0].classList.add('active');
            if(viewId === 'print-view') document.querySelectorAll('.nav-btn')[1].classList.add('active');
            if(viewId === 'settings') document.querySelectorAll('.nav-btn')[2].classList.add('active');

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobile-overlay').style.display = 'none';

            if(viewId === 'print-view') renderPrintView();
        }

        // --- RENDER EDITOR ---
        function renderEditor() {
            const container = document.getElementById('editor-table-wrapper');
            let html = `<table><thead><tr><th style="width:35px;">DAY</th><th style="width:90px;">STREAM</th>`;
            timeSlots.forEach(t => html += `<th class="time-header">${t}</th>`);
            html += `</tr></thead><tbody>`;

            days.forEach(day => {
                streams.forEach((stream, streamIndex) => {
                    html += `<tr>`;
                    if(streamIndex === 0) html += `<td rowspan="${streams.length}" class="day-cell">${day}</td>`;
                    html += `<td class="stream-cell">${stream}</td>`;

                    timeSlots.forEach((slot, slotIndex) => {
                        const key = `${day}-${stream}-${slotIndex}`;
                        const items = appState.schedule[key] || [];
                        let cellContent = `<span style="color:#ccc; font-size:1.5rem;">+</span>`;
                        let cellClass = "slot-cell";
                        
                        if (breakConfig[slotIndex]) {
                            cellContent = `<span class="break-editor">${breakConfig[slotIndex]}</span>`;
                            cellClass += " break-cell";
                        }
                        else if (items.length > 0) {
                            let conflict = false;
                            let contentHtml = "";
                            
                            items.forEach(item => {
                                if(item.isActivity) {
                                    contentHtml += `<div class="stack-item" style="background:#fffbeb; color:#b45309; border-color:#fcd34d; justify-content:center; font-weight:bold;">${item.text}</div>`;
                                } else {
                                    const teach = appState.teachers.find(t => t.id == item.teacherId);
                                    if (teach) {
                                        if(checkConflict(day, slotIndex, teach.id)) conflict = true;
                                        contentHtml += `
                                            <div class="stack-item">
                                                <span class="slot-subject">${item.subjectName}</span>
                                                <span class="slot-teacher">(${teach.number})</span>
                                            </div>`;
                                    }
                                }
                            });

                            if(conflict) cellClass += " conflict";
                            cellContent = contentHtml;
                        }

                        html += `<td class="${cellClass}" onclick="openModal('${day}', '${stream}', ${slotIndex})">${cellContent}</td>`;
                    });
                    html += `</tr>`;
                });
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // --- RENDER PRINT VIEW (HTML) ---
        function renderPrintView() {
            const container = document.getElementById('print-paper-content');
            let html = "";

            html += `<div class="print-header">`;
            html += `<h1>${appState.schoolName}</h1>`;
            html += `<p>${appState.poBox} | ${appState.term}</p>`;
            html += `</div>`;

            html += `<div class="print-grid-container">`;
            
            streams.forEach(stream => {
                html += renderStreamTableHTML(stream);
            });

            html += `</div>`; // End Grid

            // Legend
            html += `<div class="legend-box">`;
            html += `<strong>TEACHER KEY:</strong> `;
            const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            sortedTeachers.forEach(t => { html += `[${t.number}] ${t.name} `; });
            html += `</div>`;

            container.innerHTML = html;
        }

        function renderStreamTableHTML(streamName) {
            let html = `<table class="stream-table"><thead>`;
            html += `<tr><th colspan="6" class="stream-title">${streamName}</th></tr>`;
            html += `<tr><th class="time-col">TIME</th><th class="day-col">MON</th><th class="day-col">TUE</th><th class="day-col">WED</th><th class="day-col">THU</th><th class="day-col">FRI</th></tr></thead><tbody>`;
            
            timeSlots.forEach((slot, slotIndex) => {
                html += `<tr>`;
                html += `<td class="time-col">${slot}</td>`;
                
                days.forEach(day => {
                    const key = `${day}-${streamName}-${slotIndex}`;
                    const items = appState.schedule[key] || [];
                    let content = "";
                    let isBreak = false;

                    if (breakConfig[slotIndex]) {
                        content = breakConfig[slotIndex];
                        isBreak = true;
                    } else if (items.length > 0) {
                        items.forEach(item => {
                            if(item.isActivity) {
                                content += item.text + " ";
                            } else {
                                const teach = appState.teachers.find(t => t.id == item.teacherId);
                                if(teach) {
                                    content += `${item.subjectName}(${teach.number})<br>`;
                                }
                            }
                        });
                    }
                    
                    const styleClass = isBreak ? "break-print" : "";
                    html += `<td class="${styleClass}">${content}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            return html;
        }

        // --- PDF GENERATION (Fixed Logic) ---
        function generatePDFDoc() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            
            // Global Header
            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.text(appState.schoolName.toUpperCase(), 14, 12);
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`${appState.poBox} | ${appState.term}`, 14, 18);

            const startX_Left = 10;
            const startX_Right = 155; // 50% width approx
            let startY = 25;

            // --- ROW 1: Streams 0 and 1 ---
            // Explicitly draw table 1
            renderStreamPDF(doc, streams[0], startX_Left, startY);
            const y1 = doc.lastAutoTable.finalY;
            
            // Explicitly draw table 2
            renderStreamPDF(doc, streams[1], startX_Right, startY);
            const y2 = doc.lastAutoTable.finalY;

            // Determine where Row 2 should start
            // We take the MAX height of the two tables in row 1
            const row1Height = Math.max(y1, y2);
            let nextRowStart = startY + row1Height + 15; // 15mm gap

            // --- ROW 2: Streams 2 and 3 ---
            // Check if we need a new page. Page Height ~ 210mm. Safety limit 200mm.
            if (nextRowStart > 200) {
                doc.addPage();
                nextRowStart = 22; // Reset Y for new page
            }

            renderStreamPDF(doc, streams[2], startX_Left, nextRowStart);
            const y3 = doc.lastAutoTable.finalY;

            renderStreamPDF(doc, streams[3], startX_Right, nextRowStart);
            // We don't strictly need y4, just for legend calculation

            // --- LEGEND ---
            const legendY = doc.lastAutoTable.finalY + 10;
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "bold");
            doc.text("TEACHER KEY:", 14, legendY + 5);
            
            let legendLineX = 14;
            let legendLineY = legendY + 10;
            const maxWidth = 280;
            
            const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            
            let currentLine = "";
            sortedTeachers.forEach(t => {
                const text = `[${t.number}] ${t.name}  `;
                if (doc.getTextWidth(currentLine + text) > maxWidth) {
                    doc.setFont("helvetica", "normal");
                    doc.text(currentLine, legendLineX, legendLineY);
                    legendLineY += 5;
                    currentLine = text;
                } else {
                    currentLine += text;
                }
            });
            if (currentLine) {
                doc.setFont("helvetica", "normal");
                doc.text(currentLine, legendLineX, legendLineY);
            }

            return doc;
        }

        function renderStreamPDF(doc, streamName, x, y) {
            const tableBody = [];
            
            timeSlots.forEach((slot, idx) => {
                const row = [slot];
                days.forEach(day => {
                    const key = `${day}-${streamName}-${idx}`;
                    const items = appState.schedule[key] || [];
                    let cellText = "";

                    if(breakConfig[idx]) {
                        cellText = breakConfig[idx];
                    } else if (items.length > 0) {
                        items.forEach(item => {
                            if(item.isActivity) {
                                cellText += item.text + " ";
                            } else {
                                const teach = appState.teachers.find(t => t.id == item.teacherId);
                                const tNum = teach ? teach.number : "?";
                                cellText += `${item.subjectName}(${tNum}) `;
                            }
                        });
                    }
                    row.push(cellText);
                });
                tableBody.push(row);
            });

            const tableHead = ['TIME', 'MON', 'TUE', 'WED', 'THU', 'FRI'];

            doc.autoTable({
                startY: y,
                startX: x,
                head: [
                    [{ content: streamName, colSpan: 6, styles: { halign: 'center', fillColor: [200, 200, 200], textColor: 0, fontStyle: 'bold' } }],
                    tableHead
                ],
                body: tableBody,
                theme: 'grid',
                styles: { fontSize: 6.5, cellPadding: 1, fontStyle: 'normal' }, // Slightly smaller font to fit content
                headStyles: { fillColor: [37, 99, 235], textColor: 255, fontStyle: 'bold', halign: 'center' },
                columnStyles: {
                    0: { cellWidth: 18, fontStyle: 'bold' }, // Time
                },
                didParseCell: function(data) {
                    // Style Breaks specifically
                    if (data.section === 'body' && data.row.index > 0) {
                        const rawContent = data.cell.raw;
                        if (rawContent === "SHORT BREAK" || rawContent === "LONG BREAK" || rawContent === "LUNCH") {
                            data.cell.styles.fillColor = [230, 230, 230];
                            data.cell.styles.fontStyle = 'bold';
                            data.cell.styles.textColor = [80, 80, 80];
                        }
                    }
                }
            });

            return doc.lastAutoTable.finalY;
        }


        function downloadPDF() {
            // Force Render HTML to ensure it matches state before generating PDF
            renderPrintView();
            
            const doc = generatePDFDoc();
            doc.save(`Timetable_${appState.schoolName.replace(/\s+/g, '_')}.pdf`);
        }

        function downloadTemplate() {
            const originalSchedule = appState.schedule;
            appState.schedule = {};
            autoFillDefaults();
            
            renderPrintView(); // Force update
            const doc = generatePDFDoc();
            doc.save(`Template_${appState.schoolName.replace(/\s+/g, '_')}.pdf`);
            
            appState.schedule = originalSchedule;
        }


        // --- LOGIC ---
        function checkConflict(day, slotIndex, teacherId) {
            let count = 0;
            streams.forEach(str => {
                const key = `${day}-${str}-${slotIndex}`;
                const items = appState.schedule[key] || [];
                items.forEach(item => {
                    if (item.teacherId == teacherId) count++;
                });
            });
            return count > 1;
        }

        function autoFillDefaults() {
            days.forEach(day => {
                streams.forEach(stream => {
                    timeSlots.forEach((slot, slotIndex) => {
                        const key = `${day}-${stream}-${slotIndex}`;
                        if(breakConfig[slotIndex]) appState.schedule[key] = [];
                        else if (slotIndex === 12) appState.schedule[key] = [{ isActivity: true, text: gamesConfig[day] }];
                    });
                });
            });
            saveState(); 
            if(document.getElementById('print-view').classList.contains('active')) renderPrintView();
        }

        function openModal(day, stream, idx) {
            currentEdit = { day, stream, idx };
            const modal = document.getElementById('editModal');
            if(breakConfig[idx]) return;

            const key = `${day}-${stream}-${idx}`;
            tempSlotItems = appState.schedule[key] ? [...appState.schedule[key]] : [];
            
            const isAfternoonSlot = (idx === 12);

            const normalContainer = document.getElementById('normalInputContainer');
            const activitySelector = document.getElementById('activitySelector');
            const actions = document.getElementById('modalActions');
            const teacherContainer = document.getElementById('teacherInputsContainer');
            
            if (isAfternoonSlot) {
                normalContainer.style.display = 'none';
                teacherContainer.style.display = 'none';
                activitySelector.style.display = 'block';
                actions.style.display = 'none'; 
                renderComboList();
            } else {
                normalContainer.style.display = 'block';
                activitySelector.style.display = 'none';
                actions.style.display = 'flex';
                
                document.getElementById('modalSubject').value = "";
                teacherContainer.style.display = 'none';
                document.getElementById('teacherRows').innerHTML = "";
                
                renderComboList();
                populateDropdowns();
            }

            modal.style.display = 'flex';
        }

        function selectActivity(type) {
            tempSlotItems = [{
                isActivity: true,
                text: type,
                subjectName: type
            }];
            saveSlot();
        }

        function populateDropdowns() {
            const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            const teacherOptions = `<option value="">-- Select Teacher --</option>` + 
                sortedTeachers.map(t => `<option value="${t.id}">[${t.number}] ${t.name}</option>`).join('');
            
            document.getElementById('modalSubject').innerHTML = `<option value="">-- Select Subject --</option>` + 
                appState.subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function setupTeacherInputs() {
            const subjectName = document.getElementById('modalSubject').value;
            const container = document.getElementById('teacherInputsContainer');
            const rowsContainer = document.getElementById('teacherRows');

            if (!subjectName) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            rowsContainer.innerHTML = '';

            const subjectObj = appState.subjects.find(s => s.name.trim() === subjectName.trim());
            const assignedTeacherIds = subjectObj ? subjectObj.teachers : [];

            const parts = subjectName.includes('/') ? subjectName.split('/') : [subjectName];
            
            parts.forEach((part, index) => {
                const cleanPart = part.trim();
                const div = document.createElement('div');
                div.className = 'part-input-row';
                
                const label = document.createElement('label');
                label.className = 'part-label';
                label.innerText = cleanPart;
                
                const select = document.createElement('select');
                select.className = 'part-teacher-select';
                
                const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
                select.innerHTML = `<option value="">-- Select Teacher --</option>` + 
                    sortedTeachers.map(t => `<option value="${t.id}">[${t.number}] ${t.name}</option>`).join('');
                
                const prefillId = assignedTeacherIds[index] || assignedTeacherIds[0]; 
                if(prefillId) select.value = prefillId;
                
                div.appendChild(label);
                div.appendChild(select);
                rowsContainer.appendChild(div);
            });
        }

        function addToSlot() {
            const subjectName = document.getElementById('modalSubject').value;
            if(!subjectName) {
                alert("Please select a subject first.");
                return;
            }

            const rows = document.getElementById('teacherRows').querySelectorAll('.part-input-row');
            let hasTeacher = false;

            rows.forEach(row => {
                const partName = row.querySelector('.part-label').innerText;
                const teacherId = row.querySelector('select').value;
                
                if(teacherId) {
                    hasTeacher = true;
                    tempSlotItems.push({ 
                        subjectName: partName,
                        teacherId: parseInt(teacherId),
                        isActivity: false
                    });
                }
            });

            if(!hasTeacher) {
                alert("Please select a teacher for the subject.");
                return;
            }

            document.getElementById('modalSubject').value = "";
            document.getElementById('teacherInputsContainer').style.display = 'none';
            document.getElementById('teacherRows').innerHTML = "";
            
            renderComboList();
        }

        function removeFromSlot(index) {
            tempSlotItems.splice(index, 1);
            renderComboList();
        }

        function renderComboList() {
            const list = document.getElementById('comboList');
            if(tempSlotItems.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#999; padding:10px;">Empty slot</div>`;
                return;
            }
            list.innerHTML = tempSlotItems.map((item, index) => {
                if(item.isActivity) {
                    return `
                    <div class="combo-item" style="background:#fffbeb; color:#b45309;">
                        <span><b>${item.text}</b></span>
                        <span class="remove-combo" onclick="removeFromSlot(${index})">&times;</span>
                    </div>`;
                }

                const teach = appState.teachers.find(t => t.id == item.teacherId);
                const teachName = teach ? `(${teach.number})` : '(?)';
                return `
                    <div class="combo-item">
                        <span><b>${item.subjectName}</b> ${teachName}</span>
                        <span class="remove-combo" onclick="removeFromSlot(${index})">&times;</span>
                    </div>`;
            }).join('');
        }

        function saveSlot() {
            const key = `${currentEdit.day}-${currentEdit.stream}-${currentEdit.idx}`;
            appState.schedule[key] = [...tempSlotItems];
            saveState();
            document.getElementById('editModal').style.display = 'none';
            renderEditor();
        }

        function clearSlot() {
            const key = `${currentEdit.day}-${currentEdit.stream}-${currentEdit.idx}`;
            appState.schedule[key] = [];
            saveState();
            document.getElementById('editModal').style.display = 'none';
            renderEditor();
        }

        function generateRandom() {
            if(!confirm("Overwrite schedule?")) return;
            appState.schedule = {};
            autoFillDefaults();
            if(appState.teachers.length > 0 && appState.subjects.length > 0) {
                days.forEach(day => {
                    streams.forEach(stream => {
                        timeSlots.forEach((slot, idx) => {
                            if(!breakConfig[idx] && idx !== 12) {
                                const count = Math.floor(Math.random() * 2) + 1;
                                const items = [];
                                for(let k=0; k<count; k++) {
                                    const rSubj = appState.subjects[Math.floor(Math.random() * appState.subjects.length)];
                                    const rTeach = appState.teachers[Math.floor(Math.random() * appState.teachers.length)];
                                    items.push({ subjectName: rSubj.name, teacherId: rTeach.id, isActivity: false });
                                }
                                appState.schedule[`${day}-${stream}-${idx}`] = items;
                            }
                        });
                    });
                });
            }
            saveState(); 
            renderEditor();
        }
        
        function clearAll() {
            if(confirm("Clear lessons (keep breaks/games)?")) {
                days.forEach(day => {
                    streams.forEach(stream => {
                        timeSlots.forEach((slot, idx) => {
                            if(!breakConfig[idx] && idx !== 12) {
                                delete appState.schedule[`${day}-${stream}-${idx}`];
                            }
                        });
                    });
                });
                saveState(); renderEditor();
            }
        }

        // --- CRUD TEACHERS ---
        function saveTeacher() {
            const num = document.getElementById('newTeacherNum').value;
            const name = document.getElementById('newTeacher').value;
            const id = document.getElementById('editTeacherId').value;
            if(name) { 
                if(id) {
                    const teacher = appState.teachers.find(t => t.id == id);
                    if(teacher) { teacher.number = num || "?"; teacher.name = name; }
                } else {
                    appState.teachers.push({id: Date.now(), name, number: num || "?"}); 
                }
                resetTeacherForm();
                renderTeacherList(); renderSubjectTeacherOptions(); saveState(); 
            }
        }

        function deleteTeacher(id) {
            if(confirm("Delete this teacher?")) {
                appState.teachers = appState.teachers.filter(t => t.id != id);
                renderTeacherList(); renderSubjectTeacherOptions(); saveState();
            }
        }

        function editTeacher(id) {
            const t = appState.teachers.find(t => t.id == id);
            if(t) {
                document.getElementById('newTeacherNum').value = t.number;
                document.getElementById('newTeacher').value = t.name;
                document.getElementById('editTeacherId').value = t.id;
                document.getElementById('btnAddTeacher').style.display = 'none';
                document.getElementById('btnUpdateTeacher').style.display = 'inline-block';
            }
        }

        function cancelEditTeacher() {
            resetTeacherForm();
        }

        function resetTeacherForm() {
            document.getElementById('newTeacherNum').value = "";
            document.getElementById('newTeacher').value = "";
            document.getElementById('editTeacherId').value = "";
            document.getElementById('btnAddTeacher').style.display = 'inline-block';
            document.getElementById('btnUpdateTeacher').style.display = 'none';
        }

        function renderTeacherList() {
            const list = document.getElementById('teacherList');
            const sorted = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            list.innerHTML = sorted.map(t => `
                <li class="list-item">
                    <span><strong>[${t.number}]</strong> ${t.name}</span>
                    <div class="list-actions">
                        <button class="btn btn-secondary btn-sm" onclick="editTeacher(${t.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTeacher(${t.id})">Delete</button>
                    </div>
                </li>`).join('');
        }

        // --- CRUD SUBJECTS ---
        function renderSubjectTeacherOptions() {
            const select = document.getElementById('subjectTeachers');
            const sorted = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            select.innerHTML = sorted.map(t => `<option value="${t.id}">[${t.number}] ${t.name}</option>`).join('');
        }

        function saveSubject() {
            const name = document.getElementById('newSubject').value;
            const id = document.getElementById('editSubjectId').value;
            
            const selectedOptions = Array.from(document.getElementById('subjectTeachers').selectedOptions);
            const teacherIds = selectedOptions.map(option => parseInt(option.value));

            if(name) { 
                if(id) {
                    const s = appState.subjects.find(s => s.id == id);
                    if(s) { 
                        s.name = name; 
                        s.teachers = teacherIds; 
                    }
                } else {
                    appState.subjects.push({id: Date.now(), name, teachers: teacherIds}); 
                }
                resetSubjectForm();
                renderSubjectList(); saveState(); 
            }
        }

        function deleteSubject(id) {
            if(confirm("Delete this subject?")) {
                appState.subjects = appState.subjects.filter(s => s.id != id);
                renderSubjectList(); saveState();
            }
        }

        function editSubject(id) {
            const s = appState.subjects.find(s => s.id == id);
            if(s) {
                document.getElementById('newSubject').value = s.name;
                document.getElementById('editSubjectId').value = s.id;
                
                const select = document.getElementById('subjectTeachers');
                Array.from(select.options).forEach(opt => {
                    opt.selected = s.teachers.includes(parseInt(opt.value));
                });

                document.getElementById('btnAddSubject').style.display = 'none';
                document.getElementById('btnUpdateSubject').style.display = 'inline-block';
            }
        }

        function cancelEditSubject() {
            resetSubjectForm();
        }

        function resetSubjectForm() {
            document.getElementById('newSubject').value = "";
            document.getElementById('editSubjectId').value = "";
            document.getElementById('btnAddSubject').style.display = 'inline-block';
            document.getElementById('btnUpdateSubject').style.display = 'none';
            
            const select = document.getElementById('subjectTeachers');
            Array.from(select.options).forEach(opt => opt.selected = false);
        }

        function renderSubjectList() {
            const list = document.getElementById('subjectList');
            list.innerHTML = appState.subjects.map(s => {
                const assignedNames = (s.teachers || [])
                    .map(tid => {
                        const t = appState.teachers.find(x => x.id == tid);
                        return t ? `[${t.number}] ${t.name}` : '';
                    })
                    .filter(n => n)
                    .join(', ');

                return `
                <li class="list-item">
                    <div class="list-content">
                        <strong>${s.name}</strong>
                        ${assignedNames ? `<div class="list-subtext">Teachers: ${assignedNames}</div>` : ''}
                    </div>
                    <div class="list-actions">
                        <button class="btn btn-secondary btn-sm" onclick="editSubject(${s.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteSubject(${s.id})">Delete</button>
                    </div>
                </li>`;
            }).join('');
        }

        function factoryReset() {
            if(confirm("RESET EVERYTHING to default Combinations?")) { 
                appState = {
                    schoolName: "KENYA HIGH SCHOOL",
                    poBox: "12345",
                    term: "TERM 1",
                    teachers: [
                        {id: 1, name: "Mr. Phy", number: "1"},
                        {id: 2, name: "Mr. Bio", number: "2"},
                        {id: 3, name: "Mr. Geo", number: "3"},
                        {id: 4, name: "Mr. Hist", number: "4"},
                        {id: 5, name: "Mrs. Agri", number: "5"},
                        {id: 6, name: "Mr. Comp", number: "6"},
                        {id: 7, name: "Mr. Lit", number: "7"},
                        {id: 8, name: "Mrs. Kisw", number: "8"},
                        {id: 9, name: "Mr. Math", number: "9"},
                        {id: 10, name: "Mr. Eng", number: "10"}
                    ],
                    subjects: [
                        {id: 101, name: "PHY/BIO", teachers: [1, 2]}, 
                        {id: 102, name: "GEO/HIST", teachers: [3, 4]},
                        {id: 103, name: "AGRIC/COMP/HOMESCI", teachers: [5, 6]},
                        {id: 104, name: "LIT/FASIHI/BS", teachers: [7, 8]},
                        {id: 105, name: "AGRIC/BS/COMP", teachers: []},
                        {id: 106, name: "ENG", teachers: [10]},
                        {id: 107, name: "KISW", teachers: [8]},
                        {id: 108, name: "MATH", teachers: [9]},
                        {id: 109, name: "CHEM", teachers: [1]}
                    ],
                    schedule: {}
                };
                autoFillDefaults();
                saveState();
                init(); 
            }
        }

        window.onclick = function(e) {
            if(e.target == document.getElementById('editModal')) document.getElementById('editModal').style.display = 'none';
        }

        init();

    </script>
</body>
