<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kenya School Timetable Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- MOBILE NAV BAR --- */
        .mobile-nav-bar {
            display: none;
            background: var(--surface);
            padding: 10px 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom:1px solid var(--border);
            box-shadow: var(--shadow-sm);
            z-index: 60;
            position: relative;
        }
        
        .nav-arrow-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3);
        }
        
        .nav-arrow-btn:active { transform: scale(0.95); }

        /* --- ANIMATIONS --- */
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* --- SIDEBAR --- */
        aside {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 50;
            transition: transform 0.3s ease;
        }

        aside h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            background: none; border: none;
            width: 100%; text-align: left;
            padding: 14px 16px; margin-bottom: 8px;
            cursor: pointer; border-radius: var(--radius);
            font-weight: 600; color: var(--text-light);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 12px;
        }
        .nav-btn:hover { background: #eff6ff; color: var(--primary); transform: translateX(5px); }
        .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* --- MAIN CONTENT --- */
        main { flex: 1; padding: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .view-section { display: none; height: 100%; flex-direction: column; }
        .view-section.active { display: flex; }

        /* --- TOOLBAR --- */
        .toolbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 10px; }

        .toolbar input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border 0.2s;
        }
        .toolbar input:focus { border-color: var(--primary); }
        .toolbar input.school-input { font-weight: bold; width: 250px; background: #f8fafc; }

        .toolbar-actions { margin-left: auto; display: flex; gap: 10px; }

        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text-light); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #fee2e2; color: #ef4444; }
        .btn-danger:hover { background: #fecaca; }

        /* --- EDITOR TABLE --- */
        .editor-container {
            padding: 20px;
            overflow-x: auto;
            flex: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        th.day-header, td.day-cell {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 18px 6px;
            text-align: center;
            min-width: 35px;
            letter-spacing: 1px;
            font-size: 0.85rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        td.stream-cell {
            background-color: #f1f5f9;
            font-weight: 700;
            color: var(--text);
            min-width: 90px;
            text-align: left;
            padding-left: 15px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        th.time-header {
            background-color: #f8fafc;
            font-size: 0.75rem;
            color: var(--text-light);
            min-width: 75px;
            padding: 6px;
            text-transform: uppercase;
        }

        td.slot-cell {
            cursor: pointer;
            min-height: 60px;
            font-size: 0.8rem;
            transition: all 0.1s;
            position: relative;
            padding: 4px;
        }

        td.slot-cell:hover { background-color: #eff6ff; transform: scale(1.01); border-color: var(--primary); z-index: 2; }
        
        td.slot-cell.conflict { background-color: #fee2e2; border: 2px solid #ef4444; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .stack-item {
            background: rgba(255,255,255,0.6);
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 2px 4px;
            margin-bottom: 2px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .stack-item:hover { background: #fff; border-color: var(--primary); }

        .slot-subject { font-weight: 700; color: var(--primary-dark); }
        .slot-teacher { color: var(--text-light); font-size: 0.7rem; }
        
        .slot-cell.activity { background-color: #fffbeb; font-style: italic; font-weight: bold; color: #b45309; display: flex; align-items: center; justify-content: center; height: 100%; }

        /* --- PRINT OPTIMIZATION --- */
        @media print {
            @page { size: A4 landscape; margin: 0.3cm; }
            aside, .view-section:not(#print-view), .toolbar, .mobile-menu-btn, .mobile-nav-bar, .no-print { display: none !important; }
            body, main { height: auto; overflow: visible; background: white; margin: 0; padding: 0; display: block; }
            #print-view-container { display: block !important; background: white; padding: 0; }
            .print-paper { box-shadow: none; padding: 0; margin: 0; width: 100%; }
            
            .print-table { width: 100%; font-size: 8pt; table-layout: fixed; border-collapse: collapse; margin-bottom: 20px; page-break-inside: avoid; }
            .print-table th, .print-table td { border: 1px solid black; padding: 2px 3px; font-family: 'Arial', sans-serif; overflow: hidden; white-space: nowrap; }
            
            .print-col-day { width: 30px; }
            .print-col-stream { width: 60px; }
            .print-col-time { width: 60px; }
            .print-col-activity { width: 65px; }

            /* Single Global Header Styles */
            .global-header {
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 3px double black;
                padding-bottom: 10px;
            }
            .global-header h1 { margin: 0; text-transform: uppercase; font-size: 16pt; font-weight: bold; }
            .global-header p { margin: 5px 0 0 0; font-size: 11pt; }

            td.day-cell { background-color: #ccc !important; -webkit-print-color-adjust: exact; color: black !important; border: 1px solid black; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 7pt; }
            td.stream-cell { background-color: #eee !important; -webkit-print-color-adjust: exact; font-weight: bold; font-size: 8pt; }
            
            .legend-container { margin-top: 20px; border-top: 2px solid black; padding-top: 10px; font-size: 8pt; display: flex; flex-wrap: wrap; gap: 10px; }
            .legend-item { margin-right: 15px; font-weight: bold; }
        }

        /* --- SCREEN PRINT PREVIEW --- */
        #print-view-container { padding: 20px; background: #cbd5e1; height: 100%; overflow-y: auto; display: flex; justify-content: center; }
        .print-paper { background: white; width: 100%; max-width: 1200px; padding: 15px; box-shadow: var(--shadow-2xl); margin-bottom: 40px; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 400px; box-shadow: var(--shadow-2xl); animation: fadeIn 0.3s ease; max-height: 90vh; overflow-y: auto;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        
        .combo-list { margin-top: 15px; border: 1px solid #eee; border-radius: 8px; background: #f9fafb; padding: 10px; max-height: 150px; overflow-y: auto; }
        .combo-item { display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .combo-item:last-child { border-bottom: none; }
        .remove-combo { color: red; cursor: pointer; font-weight: bold; }

        .settings-card { background: white; padding: 25px; max-width: 600px; margin: 20px auto; border-radius: var(--radius); box-shadow: var(--shadow-md); border: 1px solid var(--border); }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 280px; box-shadow: 10px 0 25px rgba(0,0,0,0.1); }
            aside.open { transform: translateX(0); }
            .mobile-nav-bar { display: flex; }
            .mobile-menu-btn { display: block; }
            .toolbar { display: none; } /* Hide standard toolbar, use mobile nav */
            
            .editor-container { padding: 10px; }
            td.stream-cell { min-width: 70px; font-size: 0.8rem; padding-left: 5px; }
            th.time-header { font-size: 0.65rem; min-width: 60px; }
            td.slot-cell { font-size: 0.75rem; }
            
            .print-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" onclick="toggleSidebar()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:40;"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <h1>🇰🇪 Planner Pro</h1>
        <nav>
            <button class="nav-btn active" onclick="showView('editor')">📝 Editor</button>
            <button class="nav-btn" onclick="showView('print-view')">🖨️ Print / Export</button>
            <button class="nav-btn" onclick="showView('settings')">⚙️ Teachers & Subjects</button>
        </nav>
        <div style="margin-top: auto; font-size: 0.8rem; color: #94a3b8; text-align: center;">
            <p>Supports Multi-Subject Combinations</p>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main>
        
        <!-- MOBILE NAVIGATION (Three Arrows) -->
        <div class="mobile-nav-bar">
            <button class="nav-arrow-btn" onclick="navMobile(-1)">&#10094;</button>
            <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
            <button class="nav-arrow-btn" onclick="navMobile(1)">&#10095;</button>
        </div>

        <!-- EDITOR VIEW -->
        <section id="editor" class="view-section active">
            <div class="toolbar">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                
                <input type="text" id="schoolName" class="school-input" placeholder="School Name" oninput="updateHeaderState()">
                <input type="text" id="poBox" placeholder="P.O. Box" style="width: 100px;" oninput="updateHeaderState()">
                <input type="text" id="termName" placeholder="Term" style="width: 80px;" oninput="updateHeaderState()">
                
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="autoFillDefaults()">Auto-Fill Breaks</button>
                    <button class="btn btn-secondary" onclick="generateRandom()">Randomize</button>
                    <button class="btn btn-danger" onclick="clearAll()">Clear</button>
                </div>
            </div>

            <div class="editor-container" id="editor-table-wrapper">
                <!-- Javascript renders table here -->
            </div>
        </section>

        <!-- PRINT VIEW -->
        <section id="print-view" class="view-section">
            <!-- Added class 'no-print' to hide this on PDF -->
            <div style="background: white; padding: 10px; margin-bottom: 10px; text-align: right; border-bottom: 1px solid #ddd;" class="no-print">
                <div class="print-actions">
                    <button class="btn btn-secondary" onclick="showView('editor')">← Back to Editor</button>
                    <button class="btn btn-secondary" onclick="printTemplate()">📄 Download Empty Template</button>
                    <button class="btn btn-primary" onclick="window.print()">🖨️ Download PDF</button>
                </div>
            </div>
            <div id="print-view-container">
                <div class="print-paper" id="print-paper-content">
                    <!-- Javascript renders header and tables here -->
                </div>
            </div>
        </section>

        <!-- SETTINGS / TEACHER NUMBERS -->
        <section id="settings" class="view-section">
            <div class="settings-card animate-in">
                <h3 style="color:var(--primary);">Teacher & Subject Data</h3>
                <p style="color: var(--text-light); font-size: 0.9rem; line-height: 1.5;">
                    <strong>Combinations:</strong> To create "Physics/Chemistry" with different teachers, simply add both subjects to the same slot.
                </p>
                
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                
                <div style="margin-bottom: 25px;">
                    <label style="font-weight: bold; display:block; margin-bottom:10px;">Add Teacher</label>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <input type="text" id="newTeacherNum" placeholder="Num (e.g. 1)" style="width: 80px;">
                        <input type="text" id="newTeacher" placeholder="Name (e.g. Mr. Omondi)" style="flex:1;">
                        <button class="btn btn-primary" onclick="addTeacher()">Add</button>
                    </div>
                    <ul id="teacherList" style="padding-left: 20px; margin-top: 15px; font-size: 0.9rem; color: var(--text);"></ul>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="font-weight: bold; display:block; margin-bottom:10px;">Add Subject</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newSubject" placeholder="e.g. PHY, CHEM, HIST, GEO" style="flex:1;">
                        <button class="btn btn-primary" onclick="addSubject()">Add</button>
                    </div>
                    <ul id="subjectList" style="padding-left: 20px; margin-top: 15px; font-size: 0.9rem; color: var(--text);"></ul>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                
                <button class="btn btn-danger" onclick="factoryReset()">⚠️ Factory Reset</button>
            </div>
        </section>

    </main>

    <!-- MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: var(--primary);">Edit Slot</h3>
            <p style="font-size: 0.85rem; color: #666;">Add multiple items to create combinations (e.g., PHY + CHEM).</p>
            
            <div style="margin-top:15px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:0.9rem;">Add Subject to Slot</label>
                <div style="display:flex; gap:5px;">
                    <select id="modalSubject" style="flex:2; padding:8px; border:1px solid #ddd; border-radius:4px;"></select>
                    <select id="modalTeacher" style="flex:2; padding:8px; border:1px solid #ddd; border-radius:4px;"></select>
                    <button class="btn btn-primary" onclick="addToSlot()">+</button>
                </div>
            </div>

            <div id="comboList" class="combo-list">
                <!-- Added items appear here -->
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="clearSlot()">Clear Slot</button>
                <button class="btn btn-primary" onclick="saveSlot()">Done</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const days = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"];
        const timeSlots = [
            "8:20–9:00", "9:00–9:40", "9:40–9:50", "9:50–10:30",
            "10:30–11:10", "11:10–11:40", "11:40–12:20", "12:20–1:00",
            "1:00–2:00", "2:00–2:40", "2:40–3:20", "3:20–4:00", "4:00–6:00"
        ];
        const streams = ["10 STEM", "10 S.S", "FORM 3", "FORM 4"];
        
        const breakConfig = { 2: "B", 5: "R", 8: "LUNCH" };
        const gamesConfig = {
            "MONDAY": "GAMES", "TUESDAY": "GAMES", "WEDNESDAY": "CLUBS", 
            "THURSDAY": "GAMES", "FRIDAY": "SOCIETIES"
        };

        // --- STATE (CLEANED - NO DUMMY DATA) ---
        let appState = {
            schoolName: "YOUR SCHOOL NAME",
            poBox: "P.O. BOX",
            term: "TERM 1",
            teachers: [], // Empty
            subjects: [], // Empty
            schedule: {} 
        };

        let currentEdit = null;
        let tempSlotItems = [];

        function init() {
            const saved = localStorage.getItem('schoolPlanner_v8');
            if (saved) appState = JSON.parse(saved);
            else autoFillDefaults(); // Only fills structural breaks/games
            
            document.getElementById('schoolName').value = appState.schoolName;
            document.getElementById('poBox').value = appState.poBox;
            document.getElementById('termName').value = appState.term;

            renderLists();
            renderEditor();
        }

        function saveState() {
            localStorage.setItem('schoolPlanner_v8', JSON.stringify(appState));
        }

        function updateHeaderState() {
            appState.schoolName = document.getElementById('schoolName').value;
            appState.poBox = document.getElementById('poBox').value;
            appState.term = document.getElementById('termName').value;
            saveState();
            if(document.getElementById('print-view').classList.contains('active')) renderPrintView();
        }

        // --- NAVIGATION ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function navMobile(direction) {
            const views = ['editor', 'settings', 'print-view'];
            const current = document.querySelector('.view-section.active').id;
            let index = views.indexOf(current);
            let nextIndex = index + direction;
            if (nextIndex < 0) nextIndex = views.length - 1;
            if (nextIndex >= views.length) nextIndex = 0;
            showView(views[nextIndex]);
        }

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(viewId === 'editor') document.querySelectorAll('.nav-btn')[0].classList.add('active');
            if(viewId === 'print-view') document.querySelectorAll('.nav-btn')[1].classList.add('active');
            if(viewId === 'settings') document.querySelectorAll('.nav-btn')[2].classList.add('active');

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobile-overlay').style.display = 'none';

            if(viewId === 'print-view') renderPrintView();
            if(viewId === 'settings') document.querySelector('.settings-card').classList.remove('animate-in');
        }

        // --- RENDER EDITOR ---
        function renderEditor() {
            const container = document.getElementById('editor-table-wrapper');
            let html = `<table><thead><tr><th style="width:35px;">DAY</th><th style="width:90px;">STREAM</th>`;
            timeSlots.forEach(t => html += `<th class="time-header">${t}</th>`);
            html += `</tr></thead><tbody>`;

            days.forEach(day => {
                streams.forEach((stream, streamIndex) => {
                    html += `<tr>`;
                    if(streamIndex === 0) html += `<td rowspan="${streams.length}" class="day-cell">${day}</td>`;
                    html += `<td class="stream-cell">${stream}</td>`;

                    timeSlots.forEach((slot, slotIndex) => {
                        const key = `${day}-${stream}-${slotIndex}`;
                        const items = appState.schedule[key] || [];
                        let cellContent = `<span style="color:#ccc; font-size:1.5rem;">+</span>`;
                        let cellClass = "slot-cell";
                        
                        if (breakConfig[slotIndex]) {
                            cellContent = `<span style="font-weight:bold; color:#666;">${breakConfig[slotIndex]}</span>`;
                            cellClass += " break-cell";
                        }
                        else if (items.length > 0) {
                            let conflict = false;
                            let contentHtml = "";
                            
                            items.forEach(item => {
                                const subj = appState.subjects.find(s => s.id == item.subjectId);
                                const teach = appState.teachers.find(t => t.id == item.teacherId);
                                
                                if (subj && teach) {
                                    if(checkConflict(day, slotIndex, teach.id)) conflict = true;
                                    contentHtml += `
                                        <div class="stack-item">
                                            <span class="slot-subject">${subj.name}</span>
                                            <span class="slot-teacher">(${teach.number})</span>
                                        </div>`;
                                }
                            });

                            if(conflict) cellClass += " conflict";
                            cellContent = contentHtml;
                        }
                        else if (gamesConfig[day] && slotIndex === 12) {
                            const isActivity = items.some(i => i.isActivity);
                            if(isActivity) {
                                cellContent = items.find(i=>i.isActivity).text;
                                cellClass += " activity";
                            }
                        }

                        html += `<td class="${cellClass}" onclick="openModal('${day}', '${stream}', ${slotIndex})">${cellContent}</td>`;
                    });
                    html += `</tr>`;
                });
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // --- RENDER PRINT VIEW (SINGLE HEADER) ---
        function renderPrintView() {
            const container = document.getElementById('print-paper-content');
            
            // 1. Create Single Header Block
            const headerBlock = `
                <div class="global-header">
                    <h1>${appState.schoolName}</h1>
                    <p>${appState.poBox} | ${appState.term}</p>
                </div>
            `;

            // 2. Generate Tables
            let tablesHtml = "";
            days.forEach(day => {
                tablesHtml += `<table class="print-table">`;
                
                // Removed the previous row: <tr><th colspan="...">Name</th></tr>
                // Now we only have time headers
                
                tablesHtml += `<thead><tr>`;
                tablesHtml += `<th style="width:30px;"></th>`;
                tablesHtml += `<th style="width:60px;">STREAM</th>`;
                timeSlots.forEach(t => tablesHtml += `<th class="print-col-time">${t}</th>`);
                tablesHtml += `</tr></thead><tbody>`;

                streams.forEach((stream, streamIndex) => {
                    tablesHtml += `<tr>`;
                    if(streamIndex === 0) {
                        tablesHtml += `<td rowspan="${streams.length}" class="print-col-day day-cell">${day}</td>`;
                    }
                    tablesHtml += `<td class="print-col-stream stream-cell">${stream}</td>`;

                    timeSlots.forEach((slot, slotIndex) => {
                        const key = `${day}-${stream}-${slotIndex}`;
                        const items = appState.schedule[key] || [];
                        let content = "";
                        
                        if (breakConfig[slotIndex]) {
                            content = `<strong>${breakConfig[slotIndex]}</strong>`;
                        } else if (items.length > 0) {
                            items.forEach(item => {
                                if(item.isActivity) {
                                    content = `<span style="font-style:italic;">${item.text}</span>`;
                                } else {
                                    const subj = appState.subjects.find(s => s.id == item.subjectId);
                                    const teach = appState.teachers.find(t => t.id == item.teacherId);
                                    if(subj && teach) {
                                        content += `${subj.name}(${teach.number})<br>`;
                                    }
                                }
                            });
                        }
                        
                        const colClass = (slotIndex === 12) ? "print-col-activity" : "";
                        tablesHtml += `<td class="${colClass}">${content}</td>`;
                    });
                    tablesHtml += `</tr>`;
                });

                tablesHtml += `</tbody></table>`;
            });

            // 3. Render Legend
            const legendHtml = `<div class="legend-container"><strong>TEACHER KEY:</strong><br>`;
            const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            sortedTeachers.forEach(t => { legendHtml += `<span class="legend-item">[${t.number}] ${t.name}</span>`; });
            legendHtml += `</div>`;

            container.innerHTML = headerBlock + tablesHtml + legendHtml;
        }

        // --- PRINT EMPTY TEMPLATE (UPDATES) ---
        function printTemplate() {
            const container = document.getElementById('print-paper-content');
            
            // Header Block
            const headerBlock = `
                <div class="global-header">
                    <h1>${appState.schoolName} | ${appState.term} (TEMPLATE)</h1>
                    <p>${appState.poBox}</p>
                </div>
            `;

            // Tables (Empty)
            let tablesHtml = "";
            days.forEach(day => {
                tablesHtml += `<table class="print-table">`;
                
                tablesHtml += `<thead><tr>`;
                tablesHtml += `<th style="width:30px;"></th>`;
                tablesHtml += `<th style="width:60px;">STREAM</th>`;
                timeSlots.forEach(t => tablesHtml += `<th class="print-col-time">${t}</th>`);
                tablesHtml += `</tr></thead><tbody>`;

                streams.forEach((stream, streamIndex) => {
                    tablesHtml += `<tr>`;
                    if(streamIndex === 0) {
                        tablesHtml += `<td rowspan="${streams.length}" class="print-col-day day-cell">${day}</td>`;
                    }
                    tablesHtml += `<td class="print-col-stream stream-cell">${stream}</td>`;

                    timeSlots.forEach((slot, slotIndex) => {
                        // Only keep breaks for template, remove everything else
                        let content = "";
                        if (breakConfig[slotIndex]) {
                             content = `<strong>${breakConfig[slotIndex]}</strong>`;
                        }
                        
                        const colClass = (slotIndex === 12) ? "print-col-activity" : "";
                        tablesHtml += `<td class="${colClass}">${content}</td>`;
                    });
                    tablesHtml += `</tr>`;
                });

                tablesHtml += `</tbody></table>`;
            });

            // Legend (Empty placeholder)
            const legendHtml = `<div class="legend-container"><strong>TEACHER KEY:</strong><br></div>`;

            container.innerHTML = headerBlock + tablesHtml + legendHtml;
            setTimeout(() => { window.print(); }, 500);
            setTimeout(() => { renderPrintView(); }, 2000);
        }

        // --- LOGIC ---
        function checkConflict(day, slotIndex, teacherId) {
            let count = 0;
            streams.forEach(str => {
                const key = `${day}-${str}-${slotIndex}`;
                const items = appState.schedule[key] || [];
                items.forEach(item => {
                    if (item.teacherId == teacherId) count++;
                });
            });
            return count > 1;
        }

        function autoFillDefaults() {
            days.forEach(day => {
                streams.forEach(stream => {
                    timeSlots.forEach((slot, slotIndex) => {
                        const key = `${day}-${stream}-${slotIndex}`;
                        if(breakConfig[slotIndex]) {
                            appState.schedule[key] = [];
                        }
                        else if (slotIndex === 12) { 
                            appState.schedule[key] = [{ isActivity: true, text: gamesConfig[day] }];
                        }
                    });
                });
            });
            saveState(); renderEditor();
        }

        function openModal(day, stream, idx) {
            currentEdit = { day, stream, idx };
            const modal = document.getElementById('editModal');
            
            if(breakConfig[idx]) return;

            const key = `${day}-${stream}-${idx}`;
            tempSlotItems = appState.schedule[key] ? [...appState.schedule[key]] : [];
            
            renderComboList();
            populateDropdowns();
            modal.style.display = 'flex';
        }

        function populateDropdowns() {
            const sortedTeachers = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            document.getElementById('modalSubject').innerHTML = `<option value="">-- Subject --</option>` + 
                appState.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            document.getElementById('modalTeacher').innerHTML = `<option value="">-- Teacher --</option>` + 
                sortedTeachers.map(t => `<option value="${t.id}">[${t.number}] ${t.name}</option>`).join('');
        }

        function addToSlot() {
            const sId = document.getElementById('modalSubject').value;
            const tId = document.getElementById('modalTeacher').value;
            if(sId && tId) {
                tempSlotItems.push({ subjectId: parseInt(sId), teacherId: parseInt(tId) });
                renderComboList();
            }
        }

        function removeFromSlot(index) {
            tempSlotItems.splice(index, 1);
            renderComboList();
        }

        function renderComboList() {
            const list = document.getElementById('comboList');
            if(tempSlotItems.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#999; padding:10px;">No lessons added</div>`;
                return;
            }
            list.innerHTML = tempSlotItems.map((item, index) => {
                const subj = appState.subjects.find(s => s.id == item.subjectId);
                const teach = appState.teachers.find(t => t.id == item.teacherId);
                return `
                    <div class="combo-item">
                        <span><b>${subj.name}</b> (${teach.number})</span>
                        <span class="remove-combo" onclick="removeFromSlot(${index})">&times;</span>
                    </div>`;
            }).join('');
        }

        function saveSlot() {
            const key = `${currentEdit.day}-${currentEdit.stream}-${currentEdit.idx}`;
            appState.schedule[key] = [...tempSlotItems];
            saveState();
            document.getElementById('editModal').style.display = 'none';
            renderEditor();
        }

        function clearSlot() {
            const key = `${currentEdit.day}-${currentEdit.stream}-${currentEdit.idx}`;
            appState.schedule[key] = [];
            saveState();
            document.getElementById('editModal').style.display = 'none';
            renderEditor();
        }

        function generateRandom() {
            if(!confirm("Overwrite schedule?")) return;
            appState.schedule = {};
            autoFillDefaults();
            if(appState.teachers.length > 0 && appState.subjects.length > 0) {
                days.forEach(day => {
                    streams.forEach(stream => {
                        timeSlots.forEach((slot, idx) => {
                            if(!breakConfig[idx] && idx !== 12) {
                                const count = Math.floor(Math.random() * 2) + 1;
                                const items = [];
                                for(let k=0; k<count; k++) {
                                    const rSubj = appState.subjects[Math.floor(Math.random() * appState.subjects.length)];
                                    const rTeach = appState.teachers[Math.floor(Math.random() * appState.teachers.length)];
                                    items.push({ subjectId: rSubj.id, teacherId: rTeach.id });
                                }
                                appState.schedule[`${day}-${stream}-${idx}`] = items;
                            }
                        });
                    });
                });
            }
            saveState(); renderEditor();
        }
        
        function clearAll() {
            if(confirm("Clear lessons (keep breaks/games)?")) {
                days.forEach(day => {
                    streams.forEach(stream => {
                        timeSlots.forEach((slot, idx) => {
                            if(!breakConfig[idx] && idx !== 12) {
                                delete appState.schedule[`${day}-${stream}-${idx}`];
                            }
                        });
                    });
                });
                saveState(); renderEditor();
            }
        }

        // --- DATA ENTRY ---
        function addTeacher() {
            const num = document.getElementById('newTeacherNum').value;
            const name = document.getElementById('newTeacher').value;
            if(name) { 
                appState.teachers.push({id: Date.now(), name, number: num || "?"}); 
                document.getElementById('newTeacherNum').value = "";
                document.getElementById('newTeacher').value = "";
                renderLists(); saveState(); 
            }
        }
        function addSubject() {
            const name = document.getElementById('newSubject').value;
            if(name) { 
                appState.subjects.push({id: Date.now(), name}); 
                document.getElementById('newSubject').value = ""; 
                renderLists(); saveState(); 
            }
        }
        function renderLists() {
            const sorted = [...appState.teachers].sort((a,b) => parseInt(a.number) - parseInt(b.number));
            document.getElementById('teacherList').innerHTML = sorted.map(t => `<li><strong>[${t.number}]</strong> ${t.name}</li>`).join('');
            document.getElementById('subjectList').innerHTML = appState.subjects.map(s => `<li>${s.name}</li>`).join('');
        }

        function factoryReset() {
            if(confirm("RESET EVERYTHING?")) { localStorage.removeItem('schoolPlanner_v8'); location.reload(); }
        }

        window.onclick = function(e) {
            if(e.target == document.getElementById('editModal')) document.getElementById('editModal').style.display = 'none';
        }

        init();

    </script>
</body>
</html>
